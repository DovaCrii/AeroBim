    <!--
      **El tema, antes de pintar.** El porqué está en `public/tema.js`, junto al código.

      **Y va en un archivo y no en línea porque en línea no se ejecutaba en producción.** Esta
      página no la sirve whitenoise sino una vista de Django con `LoginRequiredMixin`, así que
      recibe la CSP, y en producción esa política lleva `script-src 'self'` sin `'unsafe-inline'`:
      el navegador lo bloqueaba en cada carga. El comentario que estaba aquí afirmaba lo contrario.
      Ningún `<script>` en línea funciona en esta página — hay una prueba que lo vigila.
    -->
    <script src="/tema.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
