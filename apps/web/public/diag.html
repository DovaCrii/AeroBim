<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>AeroBim · diagnóstico del visor</title>
    <style>
      body {
        margin: 0;
        background: #161f2d;
        color: #f8f9fa;
        font:
          13px/1.5 ui-monospace,
          monospace;
      }
      #log {
        padding: 12px;
        white-space: pre-wrap;
      }
      #escena {
        height: 50vh;
        border-top: 1px solid #ffffff22;
      }
    </style>
  </head>
  <body>
    <!--
      Página de medición para F0.4 y F0.5, deliberadamente **sin la interfaz**.

      Separa dos preguntas que juntas confunden: si el pipeline de That Open abre el
      modelo, y si nuestra envoltura lo integra bien. La lógica vive en `src/diag.ts`
      para que los módulos se resuelvan igual que en la aplicación.

      Modos: `clase` (a través de la envoltura), `manual` (componentes de That Open
      directos), `camara` (por qué los comandos de cámara no surten efecto),
      `plano` (informe de fidelidad de un DXF: qué se leyó, qué se dibujó y qué no),
      `fantasma` (cuánto del modelo está pintado de translúcido, moviendo la cámara),
      `sombras` (si las sombras están puestas de verdad, pieza por pieza) y
      `medidas` (las cuatro mediciones, una por carga: `&medida=distancia|angulo|area|
      perpendicular|vacio) y
      `pdf` (que el PDF se lee: texto extraido y busqueda, con `&buscar=`) y
      `planos` (generar un plano desde el modelo y leer su DXF de vuelta) y
      `dxf` (el exportador a DXF, con un dibujo de medidas conocidas y sin el proyector).

      Uso: /diag.html?modo=clase&ifc=/samples/muro-minimo.ifc
           /diag.html?modo=plano&dxf=/samples/fidelidad-2d.dxf
           /diag.html?modo=fantasma&ifc=/samples/Piso%205.ifc
           /diag.html?modo=sombras&ifc=/samples/Piso%205.ifc
           /diag.html?modo=medidas&medida=area&ifc=/samples/Piso%205.ifc
           /diag.html?modo=pdf&pdf=/samples/planta-prueba.pdf&buscar=vanos
           /diag.html?modo=planos&ifc=/samples/Piso%205.ifc
           /diag.html?modo=dxf
    -->
    <div id="log">iniciando…</div>
    <div id="escena"></div>
    <script type="module">
      const log = document.getElementById("log");
      const linea = (texto) => {
        log.textContent += `\n${texto}`;
      };

      const params = new URLSearchParams(location.search);
      // El modo `plano` lee un DXF y los demás un IFC; los dos llegan por el mismo argumento.
      const ifcUrl =
        params.get("dxf") ?? params.get("pdf") ?? params.get("ifc") ?? "/samples/muro-minimo.ifc";
      const modo = params.get("modo") ?? "clase";

      log.textContent =
        `modo=${modo} · archivo=${ifcUrl}\n` +
        `crossOriginIsolated=${globalThis.crossOriginIsolated} · ` +
        `SharedArrayBuffer=${typeof SharedArrayBuffer}`;

      try {
        const diag = await import("/@fs/D:/I+D/AeroBim/apps/web/src/diag.ts");
        const ejecutar = diag[modo] ?? diag.clase;
        const espera = Number(params.get("espera") ?? "0");
        // `categoria` solo lo usa el modo `psets`; los demás lo ignoran.
        const categoria = params.get("categoria") ?? undefined;
        await ejecutar(document.getElementById("escena"), ifcUrl, linea, espera, categoria);
        linea("\nOK");
        document.title = "OK · " + modo;
      } catch (error) {
        linea(`\nERROR: ${error?.stack ?? error}`);
        document.title = "ERROR · " + modo;
      }
    </script>
  </body>
</html>
