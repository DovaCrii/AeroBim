# nginx delante de AeroBim. Instalar como /etc/nginx/sites-available/aerobim:
#
#   sudo cp nginx-aerobim.conf /etc/nginx/sites-available/aerobim
#   sudo ln -sf /etc/nginx/sites-available/aerobim /etc/nginx/sites-enabled/aerobim
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# **Este archivo no existia.** Habia un fragmento `location { }` dentro de `docs/DEPLOY.md`, y eso
# dejaba el `server {}`, el TLS, el tope de subida y —sobre todo— la regla de mas abajo viviendo en
# la cabeza de quien lo monto. Una regla que solo esta en la documentacion no protege el archivo
# donde alguien la va a romper.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
#   NUNCA SE AÑADEN AQUI `Cross-Origin-Opener-Policy` NI `Cross-Origin-Embedder-Policy`.
#
#   Es la trampa mas cara de este proyecto y no da ningun error. Con aislamiento de origen,
#   `web-ifc` elige su WebAssembly multihilo, que no funciona empaquetado, y **la conversion de
#   un IFC se cuelga sin mensaje**: la barra se queda quieta para siempre y no hay nada en los
#   registros. Cuesta una sesion entera encontrarlo.
#
#   Si alguien pasa un endurecedor de cabeceras por esta maquina, esas dos se quitan.
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# **Y tampoco se toca `Content-Security-Policy`.** La pone Django por respuesta
# (`apps/core/middleware.py`) e incluye dos permisos que el visor necesita: `'wasm-unsafe-eval'` en
# `script-src` y `worker-src 'self' blob:`. Un proxy que la sobreescriba con una politica "segura"
# deja la pagina en blanco.

# El certificado sale de Tailscale, no de certbot:
#
#   sudo mkdir -p /etc/ssl/aerobim
#   sudo tailscale cert --cert-file /etc/ssl/aerobim/aerobim.crt \
#                       --key-file  /etc/ssl/aerobim/aerobim.key  <host>.<tailnet>.ts.net
#
# Es un certificado de Let's Encrypt de verdad, pedido por DNS-01 a traves de Tailscale: sin abrir
# el puerto 80, sin registro DNS publico y sin certbot. **Caduca a los 90 dias y la renovacion es
# nuestra**: hace falta un `oneshot` diario que repita ese comando y recargue nginx. Sin el, el
# servicio muere a los tres meses con un error que nadie relaciona con Tailscale.

# ══════════════════════════════════════════════════════════════════════════════════════════════
#   **AEROBIM NO ES EL UNICO INQUILINO DE ESTA MAQUINA.**
#
#   En `p340` conviven AeroControl y AeroConvert. AeroBim esta pensado para no estorbarles y
#   **no puede chocar por puerto**: gunicorn habla por el socket `/run/aerobim.sock`, no por
#   `127.0.0.1:8000`. Todo lo suyo va bajo el mismo nombre —usuario `aerobim`, `/opt/aerobim`,
#   `/var/lib/aerobim`, `/var/log/aerobim`, base `aerobim`, unidades `aerobim-*`— asi que nada
#   de eso se pisa con otro servicio.
#
#   **El unico choque posible es nginx, y esta abajo en su propio archivo.** Un bloque
#   `default_server` en el 443 solo lo puede declarar **un** sitio en toda la maquina: si
#   AeroConvert ya tiene el suyo, añadir otro hace que `nginx -t` falle con «a duplicate default
#   server» y **nginx no arranca** — o sea que instalar AeroBim tumbaria tambien a AeroConvert.
#
#   Por eso este archivo **no lo declara**. Va aparte, en `nginx-aerobim-default.conf`, y solo se
#   instala si nadie mas lo tiene. `deploy/comprobar-vecinos.sh` lo dice antes de tocar nada.
# ══════════════════════════════════════════════════════════════════════════════════════════════

# **Las zonas del limite de peticiones, para los enlaces compartidos.**
#
# Van aqui arriba y no dentro del `server` porque `limit_req_zone` es del contexto `http`, y este
# archivo se incluye **dentro** de `http` — asi que este es el sitio. Dentro de un `server`,
# `nginx -t` falla con «directive is not allowed here».
#
# **Y el nombre lleva `aerobim_` delante a proposito.** Las zonas son globales de la maquina: si
# AeroConvert declarara una llamada `compartido` y nosotros otra igual, `nginx -t` fallaria con
# «zone "compartido" is already declared» y no arrancaria ninguno de los dos. Es la misma clase de
# choque que el `default_server`, y se evita igual: llamando a lo nuestro por su nombre.
#
# 10 MB de zona son ~160 000 direcciones distintas a la vez, de sobra. 30 por minuto es holgado
# para mirar un modelo —la pagina, la ficha y el contenido son tres peticiones, mas los tramos del
# COPC, que van en la rafaga— y corta el bucle de un enlace reenviado a un grupo entero.
limit_req_zone  $binary_remote_addr zone=aerobim_compartido:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=aerobim_compartido_conn:10m;

server {
    # **`http2` va en el `listen` y no en su propia directiva.** `http2 on;` es sintaxis de
    # nginx 1.25 en adelante, y Ubuntu 24.04 trae **1.24.0**: con la forma nueva, `nginx -t` falla
    # con `unknown directive "http2"` y el servidor no arranca. Lo encontro el ensayo en un WSL con
    # la misma distribucion que la VM, que es exactamente para lo que estaba.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # El nombre que da MagicDNS. Se saca de la propia maquina:
    #   tailscale status --json | jq -r .Self.DNSName
    server_name AEROBIM_FQDN;

    ssl_certificate     /etc/ssl/aerobim/aerobim.crt;
    ssl_certificate_key /etc/ssl/aerobim/aerobim.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # **Un IFC de obra pasa de 30 MB y el COPC del levantamiento ronda los 125.** El tope del
    # registro son 200 MB (`apps/documents/storage.py`), asi que este numero es el mismo a
    # proposito: si nginx cortara antes, el usuario veria un `413` en vez del mensaje del producto.
    client_max_body_size 200M;
    client_body_timeout  300s;

    # No se anuncia la version de nginx.
    server_tokens off;

    # ══════════════════════════════════════════════════════════════════════════════════════════
    #   **LOS ENLACES COMPARTIDOS: LO UNICO QUE SE SIRVE SIN SESION.**
    #
    #   `/compartido/<testigo>/` abre **una** revision a quien tenga la direccion. Lo acota el
    #   testigo —256 bits, caduca, se revoca— y nada mas: no hay cuenta detras. Ver
    #   `apps/documents/publico.py`, que explica las reglas que Django hace cumplir.
    #
    #   Lo que se añade **aqui** es lo que Django no puede hacer solo:
    #
    #   1. **Un limite de peticiones.** Sin el, esta es la unica ruta de la maquina que un tercero
    #      puede pedir en bucle, y cada peticion de contenido sirve decenas de megas. No es tanto
    #      un ataque como un enlace reenviado a un grupo de WhatsApp: veinte personas abriendo un
    #      COPC de 124 MB a la vez son 2,5 GB de salida.
    #   2. **`noindex` como cinturon.** Django ya la manda; repetirla aqui cubre la respuesta que
    #      nginx pueda generar por su cuenta —un 429 del limite, por ejemplo—.
    #
    #   **Lo que NO se hace aqui: mandar estas rutas a otro sitio.** Van al mismo gunicorn que el
    #   resto. Separarlas en otro proceso «por seguridad» pondria dos procesos leyendo el mismo
    #   almacen de documentos, y la mitad de las reglas escritas en un sitio que el otro no lee.
    # ══════════════════════════════════════════════════════════════════════════════════════════
    location /compartido/ {
        limit_req  zone=aerobim_compartido burst=20 nodelay;
        limit_conn aerobim_compartido_conn 8;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://unix:/run/aerobim.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        # **Socket de UNIX y no `127.0.0.1:8000`.** Con un puerto, cualquier proceso de la maquina
        # puede hablarle a Django saltandose este proxy —y con el, la terminacion TLS y las
        # cabeceras de mas abajo—. El socket lo crea systemd con `0660 aerobim:www-data`, asi que
        # solo nginx llega. Ese candado es **lo que hace seguro** que Django se fie de
        # `X-Forwarded-Proto` (ver `SECURE_PROXY_SSL_HEADER` en `config/settings/prod.py`).
        proxy_pass http://unix:/run/aerobim.sock;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # **Sin esta, el sitio entero da ERR_TOO_MANY_REDIRECTS.** Django tiene
        # `SECURE_SSL_REDIRECT=True`; si no sabe que la conexion original era https, redirige a
        # https, nginx vuelve a proxear en claro, y asi para siempre. Y aunque el bucle no llegara
        # a darse, la comprobacion de `Origin` de CSRF compararia `http://` contra `https://` y
        # **cada POST responderia 403**, que es la version silenciosa del mismo fallo.
        proxy_set_header X-Forwarded-Proto $scheme;

        # **300 s, y no los 60 de fabrica.** `RevisarInterferencias` cruza los modelos vigentes de
        # la obra dentro de la peticion: 20 s medidos por par, o sea ~120 s con cuatro modelos. Con
        # el valor por omision el usuario ve un `504` a los 60 s mientras gunicorn sigue trabajando
        # otro minuto, y el hallazgo se guarda igual: un error en pantalla sobre un trabajo que
        # salio bien. Va por encima del `timeout = 120` de gunicorn a proposito, para que **quien
        # corte sea gunicorn**, que deja rastro en el journal, y no nginx, que no sabe por que.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_redirect off;
        proxy_buffering off;   # las descargas de documentos van en streaming
    }
}
