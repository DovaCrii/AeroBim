# El servidor por defecto del 443: cierra la puerta a cualquier `Host` que no sea de esta maquina.
#
#   sudo cp nginx-aerobim-default.conf /etc/nginx/sites-available/aerobim-default
#   sudo ln -sf /etc/nginx/sites-available/aerobim-default /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
#   **ESTO SOLO SE INSTALA SI NADIE MAS TIENE UN `default_server` EN EL 443.**
#
#   Es exclusivo por maquina: dos bloques con `default_server` en el mismo puerto hacen que
#   `nginx -t` falle con «a duplicate default server for 0.0.0.0:443» y **nginx entero no
#   arranca**. En `p340` conviven AeroControl y AeroConvert, asi que instalarlo sin mirar tumba
#   los tres servicios a la vez — y el mensaje de error no menciona a AeroBim.
#
#   `deploy/comprobar-vecinos.sh` contesta si el sitio esta libre. Si ya lo tiene otro, **no se
#   instala este archivo y no pasa nada**: lo que hace es cerrar el escaneo por IP, que es una
#   mejora, no un requisito. AeroBim funciona igual con el `server_name` explicito de
#   `nginx-aerobim.conf`.
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# **Que hace.** `444` cierra la conexion sin contestar nada: ni cabeceras, ni codigo de estado.
# Sin esto, quien escanee la IP recibe el primer `server` del archivo —o sea el sitio— en vez de
# nada, y de paso se entera de que ahi hay algo.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # El mismo certificado: no se usa para nada util —la conexion se corta— pero nginx exige uno
    # para poder terminar TLS antes de decidir que hacer con el `Host`.
    ssl_certificate     /etc/ssl/aerobim/aerobim.crt;
    ssl_certificate_key /etc/ssl/aerobim/aerobim.key;

    return 444;
}
